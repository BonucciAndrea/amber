name: comparative benchmarks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: build + comparative benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl unzip git make

      # ---------------------------------------------------------------
      # 1. Download DuckDB CLI
      # ---------------------------------------------------------------
      - name: Download DuckDB CLI
        id: download_duckdb
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/bench_tools
          cd /tmp/bench_tools
          curl -fsSL -o duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip"
          unzip -o duckdb.zip duckdb
          chmod +x duckdb
          ./duckdb -c "select 'duckdb ok'"

      # ---------------------------------------------------------------
      # 2. Download CBQN
      # ---------------------------------------------------------------
      - name: Download CBQN
        id: download_cbqn
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/bench_tools
          cd /tmp/bench_tools
          curl -fsSL -o cbqn "https://github.com/dzaima/CBQN/releases/latest/download/CBQN-linux-x86_64"
          chmod +x cbqn
          ./cbqn -e "•Show 1+1"

      - name: Build CBQN from source (fallback)
        if: steps.download_cbqn.outcome != 'success'
        continue-on-error: true
        run: |
          set -x
          git clone --depth 1 https://github.com/dzaima/CBQN /tmp/CBQN-src
          cd /tmp/CBQN-src
          make o3n CC=gcc -j"$(nproc)"
          cp BQN /tmp/bench_tools/cbqn
          chmod +x /tmp/bench_tools/cbqn

      # ---------------------------------------------------------------
      # 3. Build ngn/k from Codeberg
      # ---------------------------------------------------------------
      - name: Build ngn/k
        id: build_k
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/bench_tools
          git clone --depth 1 https://codeberg.org/ngn/k.git /tmp/ngnk-src
          cd /tmp/ngnk-src
          make CC=gcc -j"$(nproc)"
          cp k /tmp/bench_tools/k
          chmod +x /tmp/bench_tools/k
          echo '1+1' | /tmp/bench_tools/k

      - name: Report available comparative tools
        run: |
          ls -la /tmp/bench_tools/ || true

      # ---------------------------------------------------------------
      # 4. Build Amber
      # ---------------------------------------------------------------
      - name: Build Amber (gcc -O3 -march=native)
        run: |
          CC=gcc AMBER_NATIVE=1 ./build.sh
          ./amber -e '1+1' >/dev/null 2>&1 || true

      # ---------------------------------------------------------------
      # 5. Unit Tests
      # ---------------------------------------------------------------
      - name: Run existing unit tests
        run: |
          set -e
          out=$(./amber test.k)
          echo "$out"
          echo "$out" | grep -Eq '0 failures'

      # ---------------------------------------------------------------
      # 6. Comparative Benchmarks
      # ---------------------------------------------------------------
      - name: Run comparative benchmarks
        env:
          AMBER_BIN: ${{ github.workspace }}/amber
          DUCKDB_BIN: /tmp/bench_tools/duckdb
          CBQN_BIN: /tmp/bench_tools/cbqn
          K_BIN: /tmp/bench_tools/k
        run: |
          python3 bench/run_comparative.py --runs 5 \
            --out bench/comparative_results.md \
            --update-docs

      - name: Show results
        run: cat bench/comparative_results.md

      # ---------------------------------------------------------------
      # 7a. On main: Commit docs/BENCHMARKS.md
      # ---------------------------------------------------------------
      - name: Commit updated docs/BENCHMARKS.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/BENCHMARKS.md; then
            git add docs/BENCHMARKS.md
            git commit -m "docs: refresh comparative benchmarks [skip ci]"
            git pull --rebase origin main  # 3. Merges any incoming remote changes
            git push origin main
          else
            echo "no benchmark changes to commit"
          fi

      # ---------------------------------------------------------------
      # 7b. On PRs: Post sticky comment
      # ---------------------------------------------------------------
      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: comparative-benchmarks
          path: bench/comparative_results.md

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: comparative-benchmarks
          path: bench/comparative_results.md
