name: ci

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Grant execution permissions
        run: |
          chmod +x build.sh 2>/dev/null || true

      - name: Build amber
        run: |
          if [ -f ./build.sh ]; then
            ./build.sh
          else
            make
          fi

      - name: Ensure binary is executable
        run: chmod +x ./amber

      - name: Run test suite
        run: |
          ./amber test.k

      - name: Run examples (smoke test)
        run: |
          ./amber examples/basics.k > /dev/null
          ./amber examples/tick.k   > /dev/null
