name: ci
on:
  push:
  pull_request:

jobs:
  # ----- Linux + macOS: both have a POSIX shell, so one matrix covers them -----
  unix:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Show compiler (macOS)
        if: runner.os == 'macOS'
        # clang ships with the Xcode Command Line Tools on GitHub's macOS runners.
        run: cc --version

      - name: Build amber
        run: ./build.sh

      - name: Run test suite
        run: |
          out=$(./amber test.k)
          echo "$out"
          echo "$out" | grep -Eq '0 failures' || { echo "TESTS FAILED"; exit 1; }

      - name: Run examples (smoke)
        run: |
          ./amber examples/basics.k  > /dev/null
          ./amber examples/tick.k    > /dev/null
          ./amber examples/graphs.k  > /dev/null

  # ----- Windows via WSL (Ubuntu userland): build & test with the same bash flow -----
  windows-wsl:
    name: build-and-test (windows-wsl)
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up WSL (Ubuntu) with build tools
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential

      - name: Normalize line endings
        # Windows checkout may introduce CRLF; strip it so bash and the .k loader
        # (both read inside WSL) don't choke on carriage returns.
        run: |
          find . -type f \( -name '*.sh' -o -name '*.k' \) -print0 \
            | xargs -0 sed -i 's/\r$//'

      - name: Build amber
        run: ./build.sh

      - name: Run test suite
        run: |
          out=$(./amber test.k)
          echo "$out"
          echo "$out" | grep -Eq '0 failures' || { echo "TESTS FAILED"; exit 1; }

      - name: Run examples (smoke)
        run: |
          ./amber examples/basics.k > /dev/null
          ./amber examples/tick.k   > /dev/null
