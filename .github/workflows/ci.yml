name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so the queue stays clean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ Compiler matrix
  # WHY THIS JOB EXISTS.  It is the fastest signal in the workflow (~2 min, no
  # test suite): a toolchain-portability break is reported in minutes against a
  # named compiler version instead of being discovered at the end of the slowest
  # job. It caught a misplaced `_Pragma` that GCC 13 accepted and GCC 11 refused.
  #
  # It also compiles ONCE in strict `-std=c99` mode, which is the mode that
  # exposed the MAP_ANON/feature-macro class of bug: defining _POSIX_C_SOURCE
  # puts Darwin's headers into strict POSIX mode and hides the BSD extensions
  # src/m.c uses. glibc is permissive about this and Darwin is not, so the only
  # way to catch a regression is to compile it on both -- see the `unix` job.
  toolchains:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-11, gcc-12, gcc-13, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.cc }}
        run: sudo apt-get update && sudo apt-get install -y build-essential ${{ matrix.cc }}

      - name: Toolchain info
        run: ${{ matrix.cc }} --version

      # -Werror is deliberately NOT used: build.sh passes -w because the core
      # interpreter files carry known, documented warnings (the a.h TU()/LH()
      # sign-compare note, for one). The signal being bought here is "does this
      # compiler ACCEPT the source", which is what actually broke.
      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: |
          chmod +x a build.sh
          ./build.sh

      - name: Compile every TU under strict -std=c99
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -e
          mkdir -p o/c99
          for f in src/*.c; do
            "$CC" -std=c99 -Isrc -w -O1 -pthread -c "$f" -o "o/c99/$(basename "${f%.c}").o"
          done
          "$CC" -std=c99 -pthread -o o/c99/amber o/c99/*.o -lm -ldl
          o/c99/amber --version

      - name: Smoke test
        run: |
          set -e
          out=$(./amber test.k)
          echo "$out" | tail -5
          echo "$out" | grep -Eq '0 failures'

  # ------------------------------------------------------------------ Linux + macOS
  # The real matrix: both operating systems, and on each of them BOTH a GCC and
  # a Clang. On macOS `gcc` is a Clang shim, so the GCC leg installs a genuine
  # GCC from Homebrew and resolves its versioned name at run time rather than
  # pinning gcc-13/gcc-14 and breaking the day Homebrew moves on.
  unix:
    name: ${{ matrix.os }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: gcc
            cc: gcc
          - os: ubuntu-latest
            label: clang
            cc: clang
          - os: macos-latest
            label: clang
            cc: clang
          - os: macos-latest
            label: gcc
            cc: brew-gcc
    steps:
      - uses: actions/checkout@v4

      # tests/fuzz.py and tests/test_repl_term.py are Python; pin the version so
      # a runner image bump cannot silently change what the suite runs on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # rlwrap is a TEST dependency only: tests/test_repl_term.py asserts that
          # Amber stands down when started under it. Without rlwrap installed
          # those cases SKIP, and the regression they guard would go unnoticed.
          sudo apt-get install -y build-essential clang rlwrap

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet || true
          brew install rlwrap || true
          if [ "${{ matrix.cc }}" = "brew-gcc" ]; then brew install gcc || true; fi

      - name: Resolve compiler
        run: |
          set -e
          if [ "${{ matrix.cc }}" = "brew-gcc" ]; then
            # Homebrew installs gcc-13 / gcc-14 / ... ; take the newest present.
            CC_BIN=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* 2>/dev/null | sort -V | tail -1)
            [ -n "$CC_BIN" ] || { echo "no Homebrew gcc found"; exit 1; }
          else
            CC_BIN=$(command -v ${{ matrix.cc }})
          fi
          echo "CC=$CC_BIN" >> "$GITHUB_ENV"
          "$CC_BIN" --version | head -1

      # AMBER_NATIVE=1 is the documented performance build and therefore the one
      # CI must prove works. build.sh probes -march=native and falls back to
      # -mcpu=native (Apple Silicon / aarch64 GCC), so this line is safe on every
      # runner architecture.
      - name: Build Core Engine
        run: |
          chmod +x a build.sh
          AMBER_NATIVE=1 ./build.sh
          ./amber --version

      - name: Run Test Suite
        run: |
          chmod +x a build.sh tests/run_tests.sh tests/test_ext_seam.sh
          ./tests/run_tests.sh

      - name: Assert no rlwrap diagnostic can reach a session
        run: |
          # ./a is what this suite SPAWNS; without its bit the run dies with
          # PermissionError [Errno 13] before a single case executes.
          chmod +x a tests/test_repl_term.py
          python3 tests/test_repl_term.py .

      - name: Smoke examples
        run: |
          set -e
          for f in basics tick graphs; do
            if [ -f "examples/$f.k" ]; then
              echo "run examples/$f.k"
              ./amber "examples/$f.k" > /dev/null
            fi
          done

  # ------------------------------------------------------------------ Sanitizers
  # ASan + UBSan over every suite. Slow, so it is its own job rather than a
  # matrix leg, and it runs on Linux only -- the memory representation it checks
  # (negative-offset array headers) is platform-independent.
  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential rlwrap
      - name: Full suite under sanitizers
        run: |
          chmod +x a build.sh tests/run_tests.sh tests/test_ext_seam.sh
          ./tests/run_tests.sh --asan

  # ------------------------------------------------------------------ Windows (WSL)
  # Ubuntu userland inside WSL, so the exact same bash/build flow runs unchanged.
  windows-wsl:
    name: windows (wsl)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up WSL + build tools
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
          additional-packages: build-essential python3

      - name: Normalize line endings
        # The Windows checkout may write CRLF; strip it so bash and the .k loader
        # (both read from inside WSL) don't choke on carriage returns.
        run: |
          find . -type f \( -name '*.sh' -o -name '*.k' -o -name 'a' \) -print0 \
            | xargs -0 sed -i 's/\r$//'

      - name: Build
        run: |
          chmod +x a build.sh
          ./build.sh

      - name: Test suite
        run: |
          set -e
          out=$(./amber test.k)
          echo "$out"
          echo "$out" | grep -Eq '0 failures'

      - name: Combinatorial matrix + qSQL matrix + fuzz + C unit tests
        run: |
          chmod +x a build.sh tests/run_tests.sh tests/test_ext_seam.sh
          ./tests/run_tests.sh

      - name: Smoke examples
        run: |
          set -e
          for f in basics tick graphs; do
            if [ -f "examples/$f.k" ]; then
              echo "run examples/$f.k"
              ./amber "examples/$f.k" > /dev/null
            fi
          done

  # ------------------------------------------------------------------ Script hygiene
  # The launcher and the installers run on machines we will never see, so they
  # are linted like source. Also asserts the executable bit is actually set in
  # the index -- a clone whose scripts are mode 644 greets the user with
  # "Permission denied" on the very first command in the README.
  scripts:
    name: shell hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Executable bits are committed
        run: |
          set -e
          fail=0
          for f in a build.sh install.sh demo.sh tests/run_tests.sh tests/test_ext_seam.sh; do
            [ -f "$f" ] || continue
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode is $mode, expected 100755 -- run: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          exit $fail

      - name: No GNU-only constructs in portable scripts
        # `readlink -f` is the classic one: GNU coreutils only, absent from BSD
        # and from macOS before 12.3, where it silently resolves to nothing.
        run: |
          set -e
          # Match only a real USE. The previous pattern was '(^|[^#])readlink -f',
          # whose [^#] was meant to skip comments -- but every one of these
          # scripts documents the hazard as:
          #     # `readlink -f` is GNU coreutils. BSD/macOS ...
          # where the character before "readlink" is a BACKTICK, not the '#'.
          # So [^#] matched, the job flagged its own documentation, and this step
          # failed on every run in a tree with no `readlink -f` in it at all.
          # Anchoring at the line start instead means any '#' ahead of the match
          # excludes the line, while `x=$(readlink -f "$0")` still trips it.
          if grep -rn --include='*.sh' --include='a' -E '^[^#]*readlink[[:space:]]+-f' . ; then
            echo "::error::readlink -f is not portable; use the am_scriptdir helper"
            exit 1
          fi
          echo "clean"

      - name: shellcheck
        run: shellcheck -S warning a build.sh install.sh tests/run_tests.sh || true
